# Runs the full CI against a GridCraft tag (called by gridcraft-upstream.yml).
name: Upstream verify

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  bump-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jdsheets
          POSTGRES_PASSWORD: jdsheets
          POSTGRES_DB: jdsheets_dev
        ports: ["47322:5432"]
        options: >-
          --health-cmd "pg_isready -U jdsheets -d jdsheets_dev"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Move the submodule to ${{ inputs.tag }}
        run: node scripts/upstream-bump.mjs "${{ inputs.tag }}"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Rust toolchains
        run: |
          rustup toolchain install "$(grep -oP 'channel = "\K[^"]+' services/collab/rust-toolchain.toml)" \
            --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1,wasm-bindgen@0.2.129
      - name: Env files and the test database
        run: |
          cp .env.example .env
          cp .env.test.example .env.test
          PGPASSWORD=jdsheets psql -h 127.0.0.1 -p 47322 -U jdsheets -d jdsheets_dev -c "CREATE DATABASE jdsheets_test OWNER jdsheets;"
      - run: npm ci
      - run: npm run db:generate
      - name: Build editor with our patches
        run: npm run editor:build
      - run: npm run build
      - run: npm run build:worker
      - run: npm run rust:check
      - run: npm run rust:build
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Rust tests, including the golden workbooks
        run: npm run rust:test
      - run: npm run test:contract
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
