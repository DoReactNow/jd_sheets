# Weekly GridCraft upstream check (Decisions 6, 8, 33). Tries the newest GridCraft release with our
# patches and every check. Green: opens a pull request that bumps the submodule. Red: opens an
# issue naming the failing step. A person always merges.
name: GridCraft upstream

on:
  schedule:
    - cron: "30 2 * * 1" # Mondays 02:30 UTC (08:00 in Kolkata)
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to try (default: the newest)"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  propose:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      newer: ${{ steps.pick.outputs.newer }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Pick the release to try
        id: pick
        run: node scripts/upstream-pick.mjs "${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

  verify:
    needs: propose
    if: needs.propose.outputs.newer == 'true'
    uses: ./.github/workflows/upstream-verify.yml
    with:
      tag: ${{ needs.propose.outputs.tag }}

  report:
    needs: [propose, verify]
    if: always() && needs.propose.outputs.newer == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Open a pull request (green) or an issue (red)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.propose.outputs.tag }}
          RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$RESULT" = "success" ]; then
            git config user.name "jd-sheets-bot"
            git config user.email "jd-sheets-bot@users.noreply.github.com"
            node scripts/upstream-bump.mjs "$TAG"
            branch="gridcraft/$TAG"
            git checkout -b "$branch"
            git add vendor/gridcraft vendor/GRIDCRAFT_VERSION
            git commit -m "Bump GridCraft to $TAG"
            git push --force origin "$branch"
            gh pr create --base main --head "$branch" --title "Bump GridCraft to $TAG" \
              --body "Every check passed against GridCraft $TAG with our patches. Review the GridCraft release notes, then merge." \
              || echo "pull request already open"
          else
            gh issue create --title "GridCraft $TAG does not pass our checks" \
              --body "The weekly upstream check failed. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Fix the failing step (often a patch in patches/gridcraft/ that needs refreshing) before bumping."
          fi
