# Production images (Decision 61): built here for linux/amd64, tagged with the commit, pushed to
# the private GitHub container registry. The server only pulls (ops/deploy.sh <commit>).
# Then the stack check runs the real deploy scripts behind a real Traefik (scripts/stack-check.sh).
name: Images

on:
  push:
    branches: [main, "phase-*"]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/doreactnow/jd_sheets

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Registry login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One builder for all targets, so the Rust and Node stages are built once.
      - name: Build and push (collab, migrator, app, worker, ops)
        run: |
          set -euo pipefail
          for target in collab migrator app worker ops; do
            echo "::group::$target"
            docker buildx build \
              --platform linux/amd64 \
              --file docker/Dockerfile \
              --target "$target" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --cache-from "type=gha,scope=jdsheets-$target" \
              --cache-to "type=gha,mode=max,scope=jdsheets-$target" \
              --tag "$REGISTRY/$target:${GITHUB_SHA}" \
              --push \
              .
            echo "::endgroup::"
          done

  stack-check:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Registry login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stack check (deploy, headers, internal routes, client address, failed migration, rollback)
        # As root, like on the server; the registry login of this job is passed along.
        run: sudo DOCKER_CONFIG="$HOME/.docker" bash scripts/stack-check.sh "${GITHUB_SHA}"

      - name: Node (for the browser check)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Editor starts in a real browser (the editor built inside the image)
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node scripts/editor-smoke.mjs

      - name: Container logs
        if: failure()
        run: docker ps -a; for c in $(docker ps -aq); do echo "== $c"; docker logs --tail 80 "$c" 2>&1; done
